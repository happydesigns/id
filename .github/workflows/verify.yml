name: Verify
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:package
      - run: pnpm exec nuxt prepare
      - run: pnpm exec vitest run tests/package-types.test.ts tests/studio-project.test.ts tests/studio-http.test.ts tests/studio-package.test.ts

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm pack:studio
      - run: pnpm check:native
      - run: pnpm exec nuxt generate tests/fixtures/guide
      - run: pnpm docs:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Check release tag and write checksum
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag must match package.json"; exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            SUBJECT=$(git log -1 --format=%s)
            if [[ "$SUBJECT" != "chore(release): v$VERSION" ]]; then
              echo "Release tag must point to the Changelogen release commit"; exit 1
            fi
            node scripts/release-notes.mjs "$VERSION" > .output/studio-package/RELEASE_NOTES.md
          fi
          cd .output/studio-package
          mv id.tgz "id-$VERSION.tgz"
          sha256sum "id-$VERSION.tgz" > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: id-package-${{ github.sha }}
          path: .output/studio-package/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            .output/tests/report/
            .output/tests/results/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: id-package-${{ github.sha }}
          path: release-package
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd release-package
          sha256sum --check SHA256SUMS
          FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" id-*.tgz SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md "${FLAGS[@]}"
