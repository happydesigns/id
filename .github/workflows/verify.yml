name: Verify
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
      full: ${{ steps.scope.outputs.full }}
      suites: ${{ steps.scope.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          skip=false
          full=true
          suites='["browser","docs","package","devtools","preview"]'

          # Only an existing version tag can delegate a branch run to release CI.
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == branch ]]; then
            version=$(node -p "require('./package.json').version")
            tagged=$(git rev-parse --verify "refs/tags/v$version^{commit}" 2>/dev/null || true)
            if [[ "$tagged" == "$GITHUB_SHA" ]]; then
              skip=true
            fi
          fi

          # Unknown comparisons, manual runs and tags always retain full coverage.
          if [[ "$GITHUB_REF_TYPE" != tag && "$GITHUB_EVENT_NAME" != workflow_dispatch ]] &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            fi
            git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            if [[ -s "$RUNNER_TEMP/changed-files" ]]; then
              full=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  docs/content/4.reference/1.api.md) full=true; break ;;
                  docs/content/*.md|README.md|CHANGELOG.md) ;;
                  *) full=true; break ;;
                esac
              done < "$RUNNER_TEMP/changed-files"
            fi
            if [[ "$full" == false ]]; then
              suites='["docs"]'
            fi
          fi
          printf 'skip=%s\nfull=%s\nsuites=%s\n' "$skip" "$full" "$suites" >> "$GITHUB_OUTPUT"

  compatibility:
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:package
      - run: pnpm exec nuxt prepare
      - run: pnpm exec vitest run tests/package-types.test.ts tests/studio-project.test.ts tests/studio-generation.test.ts tests/studio-http.test.ts tests/studio-package.test.ts

  verify:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
        if: needs.changes.outputs.full == 'true'
      - run: pnpm verify
        if: needs.changes.outputs.full == 'true'
      - run: pnpm test:prepare && pnpm lint
        if: needs.changes.outputs.full != 'true'
        # Nuxt generates the ESLint configuration during preparation.
      - run: pnpm exec vitest run --config vitest.nuxt.config.ts
        if: needs.changes.outputs.full == 'true'
      - name: Check release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag must match package.json"; exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            SUBJECT=$(git log -1 --format=%s)
            if [[ "$SUBJECT" != "chore(release): v$VERSION" ]]; then
              echo "Release tag must point to the Changelogen release commit"; exit 1
            fi
          fi

  integrations:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Azure mirror repeatedly timed out while installing Chromium system dependencies.
      - name: Use the Ubuntu archive for browser dependencies
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:${{ matrix.suite }}
      - name: Write package checksum
        if: matrix.suite == 'package'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd .output/studio-package
          mv id.tgz "id-$VERSION.tgz"
          sha256sum "id-$VERSION.tgz" > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: matrix.suite == 'package'
        with:
          name: id-package-${{ github.sha }}
          path: .output/studio-package/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-diagnostics-${{ matrix.suite }}
          path: .output/tests/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, compatibility, integrations]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: id-package-${{ github.sha }}
          path: release-package
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          (cd release-package && sha256sum --check SHA256SUMS)
          pnpm exec changelogen gh release "$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --prerelease --latest=false
          fi
          gh release upload "$GITHUB_REF_NAME" release-package/id-*.tgz release-package/SHA256SUMS
