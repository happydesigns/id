name: Verify
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm pack:studio
      - run: pnpm check:native
      - run: pnpm exec nuxt generate tests/fixtures/guide
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Check release tag and write checksum
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag must match package.json"; exit 1
          fi
          cd .output/studio-package
          mv id.tgz "id-$VERSION.tgz"
          sha256sum "id-$VERSION.tgz" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: id-package-${{ github.sha }}
          path: .output/studio-package/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: id-package-${{ github.sha }}
          path: release-package
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-package/* --verify-tag --draft --generate-notes
